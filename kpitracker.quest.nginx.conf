server {
    server_name kpitracker.quest;

    root /var/www/kpitracker.quest/public;
    index index.html index.php;

    access_log /var/www/kpitracker.quest/logs/access.log;
    error_log /var/www/kpitracker.quest/logs/error.log;

    # CORS headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, x-api-key, X-Api-Key" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle OPTIONS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # API endpoints
    location /api/ {
        root /var/www/kpitracker.quest;
        
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        
        try_files $uri $uri/ =404;
    }

    # Main site
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kpitracker.quest/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kpitracker.quest/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name kpitracker.quest www.kpitracker.quest;
    
    if ($host = www.kpitracker.quest) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kpitracker.quest) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
