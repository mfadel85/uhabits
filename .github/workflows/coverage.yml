name: 📊 Code Coverage

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  coverage:
    name: 📊 Generate Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📋 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🧪 Run tests with coverage
        run: |
          ./gradlew :uhabits-core:test :uhabits-core:jacocoTestReport --continue || true
          ./gradlew :uhabits-android:testDebugUnitTest :uhabits-android:createDebugUnitTestCoverageReport --continue || true

      - name: 📊 Generate coverage report
        run: |
          echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if JaCoCo reports exist
          if [ -d "uhabits-core/build/reports/jacoco" ]; then
            echo "### Core Module" >> $GITHUB_STEP_SUMMARY
            echo "✅ Coverage report generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -d "uhabits-android/build/reports/coverage" ]; then
            echo "### Android Module" >> $GITHUB_STEP_SUMMARY
            echo "✅ Coverage report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📦 Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/**
            **/build/reports/coverage/**
            **/build/reports/tests/**
          retention-days: 14
          if-no-files-found: ignore

      - name: 📈 Upload to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: '**/build/reports/jacoco/**/*.xml'
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true
